
<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Feedback | Rakesh Baraiya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6fc;
      color: #172033;
    }
    .container { max-width: 650px; margin: 0 auto; }
    .brand-header { display:flex; align-items:center; justify-content:center; gap:13px; margin:0 auto 18px; padding:15px 18px; background:#071f3c; color:#fff; border-radius:16px; box-shadow:0 4px 18px #17203312; }
    .brand-logo { width:62px; height:62px; object-fit:contain; border-radius:12px; background:#fff; padding:4px; flex-shrink:0; }
    .brand-name { margin:0; color:#fff; font-size:19px; letter-spacing:.4px; }
    .brand-tagline { margin:5px 0 0; color:#dbeafe; font-size:13px; line-height:1.4; }
    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #17203312;
    }
    h1, h2 { margin-top: 0; }
    h1 { color: #1455d9; font-size: 26px; }
    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 7px;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd4e0;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }
    textarea { min-height: 110px; resize: vertical; }
    .stars { display: flex; gap: 8px; }
    .star {
      border: 0;
      background: none;
      padding: 0;
      font-size: 35px;
      color: #c8ced8;
      cursor: pointer;
    }
    .star.selected { color: #f5a623; }
    button.submit {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #1455d9;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .review {
      border-top: 1px solid #e5e9f0;
      padding: 14px 0;
    }
    .review-name { font-weight: bold; }
    .review-stars { color: #f5a623; }
    .muted { color: #687386; font-size: 14px; }
    #status { margin-top: 12px; }
    a { color: #1455d9; }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand-header">
      <img class="brand-logo" src="./assets/logo.png" alt="RAKESH BARAIYA Logo"
        onerror="this.onerror=null;this.src='./logo.png';">
      <div>
        <p class="brand-name"><strong>RAKESH BARAIYA</strong></p>
        <p class="brand-tagline">Application &amp; Website Developer</p>
      </div>
    </header>
    <section class="card">
      <h1>Customer Feedback</h1>
      <p>તમારો અનુભવ અમારી સાથે શેર કરો.</p>

      <form id="feedbackForm">
        <label for="name">તમારું નામ</label>
        <input id="name" maxlength="100" required
          placeholder="તમારું નામ લખો">

        <label for="service">કઈ સેવા લીધી હતી?</label>
        <select id="service" required>
          <option value="">સેવા પસંદ કરો</option>
          <option value="Mobile App Development">Mobile App Development</option>
          <option value="Website Development">Website Development</option>
          <option value="App & Website">App & Website</option>
          <option value="Customer Support">Customer Support</option>
          <option value="Other">Other</option>
        </select>

        <label>તમારું રેટિંગ પસંદ કરો</label>
        <div class="stars" id="starPicker" aria-label="Rating">
          <button class="star" type="button" data-rating="1">★</button>
          <button class="star" type="button" data-rating="2">★</button>
          <button class="star" type="button" data-rating="3">★</button>
          <button class="star" type="button" data-rating="4">★</button>
          <button class="star" type="button" data-rating="5">★</button>
        </div>

        <label for="message">તમારો Feedback</label>
        <textarea id="message" maxlength="2000" required
          placeholder="તમારો અનુભવ લખો..."></textarea>

        <button class="submit" type="submit" id="submitBtn">
          Feedback મોકલો
        </button>
        <p id="status" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>ગ્રાહકોના Feedback</h2>
      <p class="muted">ગ્રાહકોના જાહેર રિવ્યૂ અહીં દેખાશે.</p>
      <div id="reviews">Feedback લોડ થઈ રહ્યા છે...</div>
    </section>

    <p class="muted">
      <a href="./index.html">← Dashboard પર પાછા જાઓ</a>
    </p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://bgakkkbavdtcndylpwgd.supabase.co';
    const SUPABASE_KEY =
      'sb_publishable_fcs7MDIxJomgpkkuHLH1eg_Zt_UcHMh';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function notificationErrorText(error) {
      const parts = [error?.message || 'Unknown notification error'];
      const response = error?.context;
      if (response && typeof response.status === 'number') {
        parts.push('HTTP ' + response.status);
        try {
          const body = await response.clone().text();
          if (body) parts.push(body.slice(0, 700));
        } catch (_) {}
      }
      return parts.join(' — ');
    }    let rating = 0;

    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    document.querySelectorAll('.star').forEach(button => {
      button.addEventListener('click', () => {
        rating = Number(button.dataset.rating);

        document.querySelectorAll('.star').forEach(star => {
          star.classList.toggle(
            'selected',
            Number(star.dataset.rating) <= rating
          );
        });
      });
    });

    function safeText(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text ?? '';
      return element;
    }

    async function loadReviews() {
      const box = document.getElementById('reviews');
      box.replaceChildren(
        safeText('p', 'muted', 'Feedback લોડ થઈ રહ્યા છે...')
      );

      const { data, error } = await supabase
        .from('feedback')
        .select('name, service, rating, message, created_at')
        .order('created_at', { ascending: false })
        .limit(100);

      if (error) {
        box.replaceChildren(
          safeText('p', '', 'Feedback લોડ થઈ શક્યા નથી.')
        );
        console.error(error);
        return;
      }

      box.replaceChildren();

      if (!data || data.length === 0) {
        box.append(
          safeText('p', 'muted', 'હજુ કોઈ Feedback મળ્યો નથી.')
        );
        return;
      }

      data.forEach(item => {
        const review = document.createElement('article');
        review.className = 'review';

        review.append(
          safeText('div', 'review-name', item.name)
        );

        review.append(
          safeText('div', 'muted', 'સેવા: ' + item.service)
        );

        review.append(
          safeText(
            'div',
            'review-stars',
            '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating)
          )
        );

        review.append(safeText('p', '', item.message));

        review.append(
          safeText(
            'div',
            'muted',
            new Date(item.created_at).toLocaleDateString('en-IN')
          )
        );

        box.append(review);
      });
    }

    document.getElementById('feedbackForm')
      .addEventListener('submit', async event => {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();
        const service = document.getElementById('service').value;
        const message = document.getElementById('message').value.trim();

        if (!name || !service || !message || rating < 1 || rating > 5) {
          statusEl.textContent =
            'નામ, સેવા, રેટિંગ અને Feedback ભરો.';
          return;
        }

        submitBtn.disabled = true;
        statusEl.textContent = 'Feedback મોકલાઈ રહ્યો છે...';

        try {
          const { error } = await supabase.from('feedback').insert({
            name,
            service,
            rating,
            message
          });

          if (error) throw error;

          // Feedback remains saved even if notification fails; expose the exact safe diagnostic.
          let notificationWarning = '';
          try {
            const { data: notifyData, error: notifyError } = await supabase.functions.invoke('send-site-notification', {
              body: { type: 'feedback', name, service, rating, detail: message }
            });
            if (notifyError) {
              notificationWarning = await notificationErrorText(notifyError);
              console.error('Feedback email notification failed:', notificationWarning, notifyError);
            } else {
              console.info('Feedback email notification response:', notifyData);
            }
          } catch (notifyError) {
            notificationWarning = await notificationErrorText(notifyError);
            console.error('Feedback email notification failed:', notificationWarning, notifyError);
          }

          document.getElementById('feedbackForm').reset();
          const container = document.querySelector('.container');
          container.replaceChildren();
          const thanks = document.createElement('section');
          thanks.className = 'card';
          const heading = document.createElement('h1');
          heading.textContent = 'આભાર! 🙏';
          const copy = document.createElement('p');
          copy.textContent = 'તમારો Feedback સફળતાપૂર્વક સેવ થયો. RAKESH BARAIYA BUSINESS ને પસંદ કરવા બદલ આભાર.';
          const back = document.createElement('a');
          back.href = './index.html';
          back.textContent = 'Dashboard પર પાછા જાઓ';
          thanks.append(heading, copy);
          if (notificationWarning) {
            const warning = document.createElement('p');
            warning.style.cssText = 'margin:14px 0;padding:12px;border-radius:10px;background:#fff1f0;color:#b42318;overflow-wrap:anywhere;line-height:1.5';
            warning.textContent = 'Feedback સેવ થયો છે, પરંતુ Email Notification નિષ્ફળ ગયું. વિગત: ' + notificationWarning;
            thanks.appendChild(warning);
          } else {
            const note = document.createElement('p');
            note.className = 'muted';
            note.textContent = 'Email Notification Function એ વિનંતી સ્વીકારી.';
            thanks.appendChild(note);
          }
          thanks.appendChild(back);
          container.appendChild(thanks);
          rating = 0;

          document.querySelectorAll('.star').forEach(star => {
            star.classList.remove('selected');
          });

          // The thank-you screen replaces the review list, so no reload is needed here.
        } catch (error) {
          console.error(error);
          statusEl.textContent =
            'Feedback સેવ થયો નથી. Database માં service કૉલમ તપાસો.';
        } finally {
          submitBtn.disabled = false;
        }
      });

    loadReviews();
  </script>
</body>
</html>
